<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phi Hanh Gia Nhi</title>
</head>
<body>
<title>Phi Hành Gia Nhí</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Color+Emoji&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one-column cockpit on a starfield; planets are big tappable cards, lessons sit on a warm "paper" card, max 760px */
:root{
  --space:#11163a; --space-2:#1a2156; --panel:#222b69; --panel-2:#2c377f; --line:#3b4699;
  --ink:#f5f3ff; --muted:#b0b7e8; --sun:#ffc94a; --sun-ink:#4a3300;
  --math:#ff8a5b; --eng:#43cfc0; --violet:#a78bfa;
  --c-so:#ffb547; --c-c20:#ff8a5b; --c-c100:#f472b6; --c-lv:#60a5fa; --c-td:#a78bfa;
  --good:#5ee08a; --good-ink:#0b3a1d; --bad:#ff6b7a; --bad-soft:#ffc6cd;
  --dino:#5ccf8a; --dino-2:#1d4d47;
  --paper:#fff8ea; --paper-2:#f3e9d2; --paper-ink:#1e2350; --paper-muted:#6a6f99; --box:#8b93d1;
  --f-display:'Baloo 2','Nunito',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-emoji:'Noto Color Emoji','Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--space);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 40% at 85% 0%,rgba(167,139,250,.22),transparent 70%),radial-gradient(50% 35% at 0% 100%,rgba(67,207,192,.16),transparent 70%)}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky i{position:absolute;background:var(--ink);border-radius:50%;opacity:.75;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.app{position:relative;z-index:1;max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 40px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
.tnum{font-variant-numeric:tabular-nums}
.emo{font-family:var(--f-emoji)}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;min-height:56px}
.iconbtn{width:46px;height:46px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:22px;flex:none}
.iconbtn:hover{background:var(--panel-2)}
.who{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:999px;padding:4px 14px 4px 4px;min-width:0}
.who .av{width:40px;height:40px;border-radius:50%;background:var(--space-2);display:grid;place-items:center;font-size:24px;font-family:var(--f-emoji)}
.who b{font-family:var(--f-display);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.starchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,201,74,.14);color:var(--sun);border-radius:999px;padding:8px 14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

/* generic */
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);font-weight:700}
.sec{font-size:22px;margin-top:6px}
.chip{display:inline-block;background:var(--panel);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:800;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 20px;border-radius:18px;font-weight:800;font-size:18px;background:var(--panel-2)}
.btn:hover{filter:brightness(1.08)}
.btn.primary{background:var(--sun);color:var(--sun-ink)}
.btn.big{min-height:62px;font-size:21px;padding-inline:28px;font-family:var(--f-display)}
.btn.know{background:var(--good);color:var(--good-ink)}
.btn.again{background:var(--panel-2)}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.danger{background:transparent;border:2px solid var(--bad);color:var(--bad-soft)}
.btn.sm{min-height:40px;font-size:15px;padding:6px 14px;border-radius:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.panel{background:var(--panel);border-radius:24px;padding:18px}
.note{color:var(--muted);font-size:15px;text-align:center}
.banner{background:rgba(255,107,122,.14);color:var(--bad-soft);border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px}

/* welcome */
.welcome{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.welcome h1{font-size:clamp(34px,8vw,52px)}
.hero-orbit{display:flex;align-items:center;gap:18px;height:120px}
.hero-orbit .rocket{font-size:54px;font-family:var(--f-emoji);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
.form{display:flex;flex-direction:column;gap:12px}
.form label,.form .label{font-weight:800;color:var(--muted);font-size:15px}
.field{width:100%;min-height:54px;border-radius:16px;border:2px solid var(--line);background:var(--space-2);color:var(--ink);font:inherit;font-size:20px;font-weight:700;padding:8px 14px}
.field:focus{border-color:var(--sun);outline:none}
.avatars{display:flex;gap:10px;flex-wrap:wrap}
.avpick{width:58px;height:58px;border-radius:18px;background:var(--space-2);font-size:32px;font-family:var(--f-emoji);border:3px solid transparent}
.avpick.on{border-color:var(--sun);background:var(--panel-2)}

/* home */
.hello{display:flex;flex-direction:column;gap:8px}
.hello h1{font-size:clamp(28px,6.4vw,40px)}
.planets{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.planet-card{background:var(--panel);border-radius:28px;padding:20px 12px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;border:2px solid transparent;transition:transform .15s}
.planet-card:hover{transform:translateY(-3px);border-color:var(--line)}
.planet{--pc:var(--math);position:relative;width:min(120px,30vw);aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),transparent 34%),radial-gradient(circle at 50% 50%,var(--pc) 58%,color-mix(in srgb,var(--pc) 60%,#000) 100%);
  box-shadow:inset -10px -12px 0 rgba(0,0,0,.16)}
.planet::after{content:"";position:absolute;left:-20%;right:-20%;top:40%;height:24%;border:5px solid rgba(255,255,255,.5);border-radius:50%;transform:rotate(-14deg);border-top-color:transparent}
.planet b{position:relative;z-index:1;font-family:var(--f-display);font-size:clamp(20px,5vw,28px);color:var(--paper-ink);letter-spacing:.04em}
.p-eng{--pc:var(--eng)}
.pc-name{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.1}
.pc-sub{color:var(--muted);font-size:14px;font-weight:700}
.mini-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mini{display:flex;align-items:center;gap:12px;text-align:left;background:var(--space-2);border:2px solid var(--line);border-radius:22px;padding:14px}
.mini:hover{background:var(--panel)}
.mini-ic{font-size:34px;font-family:var(--f-emoji);flex:none}
.mini b{display:block;font-family:var(--f-display);font-size:18px;line-height:1.15}
.mini small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.mission{background:linear-gradient(135deg,var(--panel-2),var(--panel));border:2px solid var(--violet);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
.mission h2{font-size:20px}
.mrow{display:flex;align-items:center;gap:12px;background:var(--space-2);border-radius:16px;padding:10px 12px;text-align:left;width:100%}
.mrow .ck{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;flex:none;font-weight:900;color:var(--good-ink)}
.mrow.done .ck{background:var(--good);border-color:var(--good)}
.mrow.done span.t{text-decoration:line-through;color:var(--muted)}

/* stations */
.stations{display:flex;flex-direction:column;gap:12px}
.station{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:22px;padding:14px;text-align:left;width:100%;border:2px solid transparent}
button.station:hover{border-color:var(--line)}
.orb{--c:var(--math);width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:26px;font-family:var(--f-emoji);
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.5),transparent 38%),var(--c);box-shadow:inset -6px -7px 0 rgba(0,0,0,.15)}
.orb.letter{font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--paper-ink)}
.st-body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.st-name{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.15}
.st-sub{color:var(--muted);font-size:14px;font-weight:700}
.pips{display:flex;gap:4px;margin-top:2px}
.pips i{width:22px;height:7px;border-radius:4px;background:var(--panel-2)}
.pips i.on{background:var(--sun)}
.station.locked{background:transparent;border:2px dashed var(--line);opacity:.7}
.station.locked .orb{background:var(--panel);box-shadow:none;font-size:20px}

/* quiz */
.qprog{display:flex;gap:5px}
.seg{flex:1;height:9px;border-radius:5px;background:var(--panel-2)}
.seg.ok{background:var(--sun)}
.seg.miss{background:var(--violet)}
.seg.now{background:var(--ink)}
.qmeta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-weight:800;font-size:14px}
.qcard{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:28px;padding:62px 18px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 10px 0 var(--paper-2)}
.qtext{font-size:22px;font-weight:800;line-height:1.45;max-width:34ch}
.qtext b{color:var(--paper-ink)}
.qsub{font-size:16px;color:var(--paper-muted);font-weight:700}
.expr{font-family:var(--f-display);font-size:clamp(36px,10vw,56px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.expr.seq{font-size:clamp(28px,8vw,44px)}
.box{display:inline-flex;align-items:center;justify-content:center;min-width:1.25em;padding:0 .15em;border:3px dashed var(--box);border-radius:12px;color:var(--box);line-height:1.1}
.pic{font-family:var(--f-display);font-size:clamp(26px,7vw,38px);font-weight:800}
.pic .emo{font-size:1.1em}
.bigemoji{font-size:96px;line-height:1.25;font-family:var(--f-emoji)}
.qicon{font-size:56px;font-family:var(--f-emoji);line-height:1.3}
.letter-big{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:1;color:var(--eng)}
.sent{font-family:var(--f-display);font-size:clamp(26px,7vw,36px);font-weight:800}
.speak{position:absolute;top:12px;right:12px;width:48px;height:48px;border-radius:50%;background:var(--paper-2);color:var(--paper-ink);font-size:22px;display:grid;place-items:center}
.speak:hover{filter:brightness(.95)}
.answer{display:flex;flex-direction:column;gap:12px}
.ansbox{display:flex;align-items:baseline;justify-content:center;gap:10px;font-family:var(--f-display);font-weight:800}
.ansval{min-width:120px;padding:4px 18px;border-radius:18px;background:var(--space-2);border:3px solid var(--line);font-size:42px;text-align:center;font-variant-numeric:tabular-nums}
.ansval.empty{color:var(--muted)}
.unit{font-size:24px;color:var(--muted)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;width:100%;margin:0 auto}
.key{height:62px;border-radius:18px;background:var(--panel-2);font-family:var(--f-display);font-weight:800;font-size:30px}
.key:active{transform:scale(.96)}
.key.ok{background:var(--good);color:var(--good-ink);font-size:22px}
.key.del{font-size:22px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.choice{min-height:74px;border-radius:20px;background:var(--panel-2);font-family:var(--f-display);font-weight:800;font-size:28px;padding:8px;display:flex;align-items:center;justify-content:center;gap:10px;border:3px solid transparent}
.choice:hover:not(:disabled){border-color:var(--line)}
.choice.e{font-family:var(--f-emoji);font-size:58px;min-height:112px}
.choice.ph{flex-direction:column;gap:2px;font-size:22px}
.choice.ph .emo{font-size:40px}
.choice.right{background:var(--good);color:var(--good-ink)}
.choice.wrong{background:var(--bad);color:var(--paper-ink);opacity:.8}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{width:46px;height:56px;border-bottom:4px solid var(--box);font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--paper-ink);display:grid;place-items:center}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tile{width:56px;height:60px;border-radius:16px;background:var(--panel-2);font-family:var(--f-display);font-weight:800;font-size:30px}
.tile:disabled{opacity:.2}
.fb{border-radius:18px;padding:12px 16px;font-weight:800;font-size:17px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.fb.good{background:rgba(94,224,138,.16);color:var(--good)}
.fb.bad{background:rgba(255,107,122,.14);color:var(--bad-soft)}
.fb .hint{color:var(--ink);font-weight:700}
.fb .btn{align-self:stretch}

/* flashcards */
.fc-scene{perspective:1400px}
.fcard{position:relative;width:100%;max-width:440px;height:min(52vh,370px);min-height:280px;margin:0 auto;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.8,.3,1);cursor:pointer;border-radius:30px}
.fcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;background:var(--paper);color:var(--paper-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:46px 18px 20px;box-shadow:0 10px 0 var(--paper-2);overflow:hidden;isolation:isolate}
.back{transform:rotateY(180deg)}
.fc-emoji{font-size:clamp(96px,26vw,130px);line-height:1.25;font-family:var(--f-emoji)}
.fc-emoji.sm{font-size:64px}
.fc-word{font-family:var(--f-display);font-size:clamp(44px,12vw,62px);font-weight:800;line-height:1}
.fc-vi{font-size:22px;font-weight:800;color:var(--paper-muted)}
.fc-sent{font-size:19px;font-weight:700;background:var(--paper-2);border-radius:12px;padding:6px 12px}
.fc-tip{font-weight:800;color:var(--paper-ink);font-size:15px;background:rgba(255,255,255,.88);border-radius:999px;padding:4px 14px}
.tag{position:absolute;top:14px;left:14px;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:#ffe3a3;color:#6b4300}
.tag.rev{background:#dcd5ff;color:#3a2a8c}
.tag.old{background:#c9f1ea;color:#0d4a43}
.tag.ext{background:#ffd5e8;color:#7a1d4b}
.fc-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fc-actions .btn{flex:1 1 140px;max-width:220px}
.fc-head{display:flex;justify-content:space-between;gap:10px;font-weight:800;color:var(--muted)}

/* done / result */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:20px}
.done .hero-emo{font-size:84px;font-family:var(--f-emoji);line-height:1.2}
.done h2{font-size:clamp(32px,8vw,46px)}
.score{font-size:20px;font-weight:800;color:var(--muted)}
.score b{font-family:var(--f-display);font-size:44px;color:var(--ink)}
.stars-row{font-size:52px;font-family:var(--f-emoji);letter-spacing:6px}
.badge-new{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--sun);border-radius:18px;padding:10px 16px;text-align:left}
.badge-new .emo{font-size:34px}
.wordlist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:800}

/* constellation */
.tiers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tier{background:var(--panel);border-radius:16px;padding:10px 4px;text-align:center}
.tier .emo{font-size:26px;display:block}
.tier b{font-family:var(--f-display);font-size:24px;display:block;line-height:1}
.tier small{color:var(--muted);font-weight:700;font-size:12px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.fchip{white-space:nowrap;border-radius:999px;padding:8px 14px;background:var(--panel);font-weight:800;font-size:15px;border:2px solid transparent}
.fchip.on{border-color:var(--sun);color:var(--sun)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.wtile{background:var(--space-2);border:2px solid var(--line);border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.wtile.unseen{opacity:.45;border-style:dashed}
.wtile .e{font-size:38px;font-family:var(--f-emoji);line-height:1.1}
.wtile b{font-family:var(--f-display);font-size:18px}
.wtile small{color:var(--muted);font-weight:700;font-size:12px}
.moon{font-family:var(--f-emoji);font-size:16px}

/* rewards */
.wallet{display:flex;align-items:center;gap:16px}
.wallet .emo{font-size:56px}
.wallet b{font-family:var(--f-display);font-size:46px;line-height:1;color:var(--sun)}
.rw{display:flex;flex-direction:column;gap:10px;background:var(--panel);border-radius:20px;padding:14px}
.rw-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.rw-top b{font-family:var(--f-display);font-size:19px}
.bar{height:12px;border-radius:6px;background:var(--space-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:6px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{background:var(--panel);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px}
.bdg .emo{font-size:34px}
.bdg b{font-family:var(--f-display);font-size:17px;line-height:1.15}
.bdg small{color:var(--muted);font-weight:700;font-size:13px}
.bdg.off{opacity:.4;filter:grayscale(1)}

/* gate */
.gate{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-top:16px}
.gate h2{font-size:32px}
.pin{display:flex;gap:14px}
.pin span{width:22px;height:22px;border-radius:50%;border:3px solid var(--line)}
.pin span.on{background:var(--sun);border-color:var(--sun)}
.err{color:var(--bad-soft);font-weight:800}

/* parent */
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px}
.tab{white-space:nowrap;border-radius:14px;padding:10px 14px;background:var(--panel);font-weight:800;font-size:15px}
.tab.on{background:var(--ink);color:var(--space)}
.pgrid{display:flex;flex-direction:column;gap:14px}
.pcard{background:var(--panel);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pcard h3{font-size:19px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--space-2);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-weight:700;font-size:13px}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}

const W = {}, UNIT = {}, ALLW = [];

}

  },
  g6thapphan(L) {
    const t = pick(L === 1 ? ['add','mul','round'] : L === 2 ? ['add','sub','round','pct'] : ['mul','pct','pct2','div']);
    const d1 = () => R(11, 999) / 10, d2 = () => R(101, 9999) / 100;
    if (t === 'add') { const a = d2(), b = d1(); return numQ(`<div class="expr">${vn(a)} + ${vn(b)} = ${BOX}</div>`, null, vn(a + b), 'Đặt tính thẳng dấu phẩy rồi cộng.', DEC); }
    if (t === 'sub') { const a = d2() + 20, b = d1(); return numQ(`<div class="expr">${vn(a)} − ${vn(b)} = ${BOX}</div>`, null, vn(a - b), 'Đặt tính thẳng dấu phẩy rồi trừ.', ND); }
    if (t === 'mul') { const a = d1(), k = R(2, 9); return numQ(`<div class="expr">${vn(a)} × ${k} = ${BOX}</div>`, null, vn(a * k), `Nhân như số tự nhiên rồi đặt dấu phẩy: ${vn(a * k)}.`, DEC); }

    if (t === 'round') { const a = R(1001, 99999) / 1000, place = pick([1, 2]); const r = Math.round(a * 10 ** place) / 10 ** place;
      return numQ(`Làm tròn số ${vn(a)} đến hàng ${place === 1 ? 'phần mười' : 'phần trăm'}: ${BOX}`, null, vn(r), `Xét chữ số ngay sau hàng ${place === 1 ? 'phần mười' : 'phần trăm'}: ≥ 5 thì tăng 1.`, DEC); }
    if (t === 'pct') { const p = pick([10, 20, 25, 50, 75, 5, 40]), b = pick([20, 40, 60, 80, 120, 200, 400]); if (p * b % 100) return gen.g6thapphan(L);
      return numQ(`${p}% của ${b} là ${BOX}`, null, p * b / 100, `${b} × ${p} : 100 = ${p * b / 100}.`); }

  g6hinhhoc(L) {

  g6thongke(L) {

  g6td2(L) {
    const t = pick(['frac','angle','pct','seq']);
    if (t === 'frac') { const n = R(3, 9); return chq2(`Tính nhanh: ${Array.from({ length:n }, (_, i) => frac(1, `${i + 1}·${i + 2}`)).slice(0, 3).join(' + ')} + … + ${frac(1, `${n}·${n + 1}`)}`, fstr(n, n + 1), [fstr(1, n + 1), fstr(n + 1, n), fstr(n - 1, n)], `Mỗi số hạng 1/(k(k+1)) = 1/k − 1/(k+1). Tổng = 1 − 1/${n + 1} = ${n}/${n + 1}.`); }
    if (t === 'angle') { const a = R(20, 160); return numQ(`Hai góc kề bù có một góc bằng ${a}°. Góc còn lại bằng:`, null, 180 - a, `Hai góc kề bù có tổng 180°: 180 − ${a} = ${180 - a}.`, { unit:'°' }); }

    const pie = `<div class="qfig"><svg viewBox="-60 -60 120 120" width="170" role="img" aria-label="Biểu đồ hình quạt">${(() => { let a = -Math.PI / 2, s = ''; parts.forEach((p, i) => { const b = a + p / 100 * 2 * Math.PI, l = p > 50 ? 1 : 0;
      s += `<path d="M0 0 L${f1(55 * Math.cos(a))} ${f1(55 * Math.sin(a))} A55 55 0 ${l} 1 ${f1(55 * Math.cos(b))} ${f1(55 * Math.sin(b))} Z" fill="${FILLS[i]}" stroke="#fff" stroke-width="2"/>`;
      const m = (a + b) / 2; s += `<text x="${f1(32 * Math.cos(m))}" y="${f1(32 * Math.sin(m) + 5)}" font-size="12" font-weight="800" text-anchor="middle" fill="#1e2350" font-family="Nunito,sans-serif">${p}%</text>`; a = b; }); return s; })()}</svg></div>
      <div class="qsub">${names.map((n, i) => `<span style="color:${FILLS[i]}">■</span> ${n}`).join(' · ')}</div>`;
    if (t === 'pie') { const i = R(0, 2); return numQ(`${pie}<div>Môn ${names[i]} chiếm bao nhiêu phần trăm?</div>`, null, parts[i], 'Đọc số ghi trên phần hình quạt.', { unit:'%' }); }
    if (t === 'pie2') { const tot = pick([40, 80, 120, 200]), i = R(0, 2); if ((tot * parts[i]) % 100) return gen.g5thongke(L);
      return numQ(`${pie}<div>Có ${tot} học sinh được hỏi. Bao nhiêu bạn thích ${names[i]}?</div>`, null, tot * parts[i] / 100, `${tot} × ${parts[i]} : 100 = ${tot * parts[i] / 100}.`, { unit:'bạn' }); }
    if (t === 'count') { const n = pick([20, 30, 50]), k = R(1, n - 1); return numQ(`Gieo xúc xắc ${n} lần, mặt 3 chấm xuất hiện ${k} lần. Mặt 3 chấm không xuất hiện bao nhiêu lần?`, null, n - k, `${n} − ${k} = ${n - k}.`, { unit:'lần' }); }
    const n = pick([10, 20, 25, 50]), k = R(1, n - 1); return chq2(`Tung đồng xu ${n} lần, mặt ngửa xuất hiện ${k} lần. Tỉ số của số lần xuất hiện mặt ngửa và tổng số lần tung là:`, fstr(k, n), [fstr(n - k, n), fstr(k, n - k || 1), fstr(n, k)].filter(x => x !== fstr(k, n)), `${k} : ${n} = ${fstr(k, n)}.`);
  },
  g5td2(L) {
    const t = pick(['chase','pct2','cube','avg']);
    if (t === 'chase') { const v1 = R(4, 6) * 10, v2 = v1 + R(1, 3) * 10, d = (v2 - v1) * pick([1, 2]); return numQ(`Xe máy đi trước ô tô ${d} km. Xe máy đi ${v1} km/giờ, ô tô đuổi theo với ${v2} km/giờ. Sau mấy giờ ô tô đuổi kịp?`, null, d / (v2 - v1), `Mỗi giờ ô tô gần thêm ${v2 - v1} km: ${d} : ${v2 - v1} = ${d / (v2 - v1)}.`, { unit:'giờ' }); }
    if (t === 'pct2') { return numQ('Giá một món hàng tăng 10% rồi lại giảm 10%. So với giá ban đầu, giá mới bằng bao nhiêu phần trăm?', null, 99, '110% × 90% = 99%.', { unit:'%' }); }
    if (t === 'cube') { const a = R(2, 5); return numQ(`Xếp các hình lập phương nhỏ cạnh 1 cm thành hình lập phương lớn cạnh ${a} cm. Cần bao nhiêu hình lập phương nhỏ?`, null, a ** 3, `${a} × ${a} × ${a} = ${a ** 3}.`, { unit:'hình' }); }
    const a = R(6, 9), b = R(6, 9), need = R(8, 9); return numQ(`Bình được ${a} điểm và ${b} điểm ở hai bài kiểm tra. Bài thứ ba cần bao nhiêu điểm để điểm trung bình ba bài là ${need}?`, null, need * 3 - a - b, `Tổng cần ${need * 3}: ${need * 3} − ${a} − ${b} = ${need * 3 - a - b}.`, { unit:'điểm' });
  },
};

    if (t === 'dice2') { const s = R(4, 10), ways = [1,2,3,4,5,6].reduce((n, i) => n + [1,2,3,4,5,6].filter(j => i + j === s).length, 0); return chq2(`Gieo hai con xúc xắc. Xác suất tổng số chấm bằng ${s} là:`, fstr(ways, 36), [fstr(1, 6), fstr(ways, 12), fstr(ways + 1, 36)].filter(x => x !== fstr(ways, 36)), `Có 36 kết quả, ${ways} kết quả có tổng bằng ${s}.`); }

  g8dongdang(L) {
    const t = pick(L === 1 ? ['hyp','hyp','leg'] : L === 2 ? ['hyp','leg','ratio'] : ['ratio','side','check']);
    const [x, y, z] = pick(TRIPLES);
    if (t === 'hyp') return numQ(`Tam giác vuông có hai cạnh góc vuông ${x} cm và ${y} cm. Cạnh huyền dài:`, null, z, `√(${x * x} + ${y * y}) = √${z * z} = ${z} (cm).`, { unit:'cm' });
    if (t === 'leg') return numQ(`Tam giác vuông có cạnh huyền ${z} cm, một cạnh góc vuông ${x} cm. Cạnh góc vuông còn lại dài:`, null, y, `√(${z * z} − ${x * x}) = ${y} (cm).`, { unit:'cm' });
    if (t === 'check') { const ok = Math.random() < .5, c = ok ? z : z + 1; return chq(`Tam giác có ba cạnh ${x} cm, ${y} cm, ${c} cm có phải tam giác vuông không?`, ok ? 'Có' : 'Không', ['Có','Không'], `So sánh ${c}² = ${c * c} với ${x}² + ${y}² = ${x * x + y * y}.`); }
    const k = R(2, 4), a = R(2, 9);
    if (t === 'ratio') return numQ(`△ABC ∽ △DEF với tỉ số đồng dạng k = ${k}. Biết EF = ${a} cm. Cạnh BC dài:`, null, k * a, `BC = k × EF = ${k} × ${a} = ${k * a} (cm).`, { unit:'cm' });
    return numQ(`△ABC ∽ △MNP, AB = ${a * k} cm, MN = ${a} cm, BC = ${R(2, 6) * k} cm. Tỉ số đồng dạng của △ABC so với △MNP là ${BOX}`, null, k, `k = AB : MN = ${a * k} : ${a} = ${k}.`);
  },
  g8hinhchop(L) {
    const t = pick(L === 1 ? ['faces','vol','vol'] : ['vol','sxq','vol2']);
    if (t === 'faces') { const q = pick([['Hình chóp tứ giác đều có bao nhiêu mặt bên?', 4], ['Hình chóp tam giác đều có bao nhiêu mặt?', 4], ['Hình chóp tứ giác đều có bao nhiêu đỉnh?', 5], ['Hình chóp tứ giác đều có bao nhiêu cạnh?', 8]]); return numQ(q[0], null, q[1], 'Đếm trên hình vẽ: đáy và các mặt bên.'); }
    if (t === 'vol') { const a = R(2, 10), h = 3 * R(1, 6); return numQ(`Hình chóp tứ giác đều có cạnh đáy ${a} cm, chiều cao ${h} cm. Thể tích là:`, null, a * a * h / 3, `V = ⅓ × ${a}² × ${h} = ${a * a * h / 3} (cm³).`, { unit:'cm³' }); }
    if (t === 'vol2') { const S = 3 * R(4, 30), h = R(2, 12); return numQ(`Hình chóp tam giác đều có diện tích đáy ${S} cm², chiều cao ${h} cm. Thể tích là:`, null, S * h / 3, `V = ⅓ × ${S} × ${h} = ${S * h / 3} (cm³).`, { unit:'cm³' }); }
    const a = R(2, 12), d = R(3, 15); return numQ(`Hình chóp tứ giác đều có cạnh đáy ${a} cm, trung đoạn ${d} cm. Diện tích xung quanh là:`, null, 2 * a * d, `Sxq = nửa chu vi đáy × trung đoạn = ${2 * a} × ${d} = ${2 * a * d} (cm²).`, { unit:'cm²' });
  },
  g8td2(L) {
    const t = pick(['abs','ladder','prob','eq']);
    if (t === 'abs') { const a = R(1, 9), b = R(1, 9); return numQ(`Phương trình |x − ${a}| = ${b} có nghiệm lớn hơn là x = ${BOX}`, null, a + b, `x − ${a} = ±${b} ⇒ x = ${a + b} hoặc x = ${a - b}.`, NEG); }
    if (t === 'ladder') { const [x, y, z] = pick(TRIPLES); return numQ(`Một cái thang dài ${z} m dựa vào tường, chân thang cách chân tường ${x} m. Đỉnh thang cao bao nhiêu mét so với mặt đất?`, null, y, `√(${z}² − ${x}²) = ${y} (m).`, { unit:'m' }); }
    if (t === 'prob') return chq2('Gieo hai đồng xu cân đối. Xác suất được hai mặt giống nhau là:', '1/2', ['1/4', '3/4', '1/3'], 'SS, NN thuận lợi trong 4 kết quả SS, SN, NS, NN.');

  },

function distract(w, n) {
  const same = shuffle(UNIT[w.unit].words.filter(x => x.id !== w.id));
  const g = UNIT[w.unit].g, rest = shuffle(ALLW.filter(x => x.unit !== w.unit && UNIT[x.unit].g === g));
  const seen = new Set([w.w, w.vi]), out = [];   // không lặp từ trùng chữ hoặc trùng nghĩa
  for (const x of [...same, ...rest]) { if (seen.has(x.w) || seen.has(x.vi)) continue; seen.add(x.w); seen.add(x.vi); out.push(x); if (out.length >= n) break; }
  return out;
}
function engQ(type, wid) {

      say:[['Nghe và chọn từ đúng','vi'],[w.w,'en']], replay:[[w.w,'en']], choices: shuffle([w, ...distract(w, 3)]).map(x => ({ label:esc(x.w), value:x.id })), answer:wid });

      say:[['Chọn từ tiếng Anh đúng','vi']], choices: shuffle([w, ...distract(w, 3)]).map(x => ({ label:esc(x.w), value:x.id })), answer:wid });
  }

    return Object.assign(base, { input:'choice', ccls:'', text:`${stage(u.id, `<span class="bigemoji sticker">${w.e}</span>`)}<div>Đây là gì?</div>`,
      say:[['Đây là gì?','vi']], choices: shuffle([w, ...distract(w, 3)]).map(x => ({ label:esc(x.w), value:x.id })), answer:wid });
  }
  if (type === 'sentence') {

      say:[['Chọn từ đúng để điền vào chỗ trống','vi']], choices: shuffle([w, ...distract(w, 2)]).map(x => ({ label:esc(x.w), value:x.id })), answer:wid, okSay:[[w.s,'en']] });
  }

    const bad = [...new Map(shuffle(gradeWords(u.g).filter(x => !has(x))).map(x => [x.w, x])).values()].slice(0, 2);
    const big = L.length === 1 ? L.toUpperCase() + L : L;
    return Object.assign(base, { input:'choice', ccls:'ph', text:`${stage(u.id, `<span class="letter-big sticker">${big}</span>`)}<div>Từ nào có chữ <b>${L}</b> (âm ${u.sound})?</div>`,
      say:[[`Từ nào có chữ ${u.letter}?`,'vi']], choices: shuffle([w, ...bad]).map(x => ({ label:`<span class="emo">${x.e}</span><span>${esc(x.w)}</span>`, value:x.id })), answer:wid });
  }

}

function gramQ(uid, i) {

    say:[[sent.replace(/_+/g, ' blank '), 'en']], okSay:[[full, 'en']], answer:ans, hint: why || '', reveal:`<b>${esc(full)}</b>${why ? ' – ' + esc(why) : ''}`,
    revealSay:[['Đáp án đúng là','vi'], [full, 'en']], choices: shuffle([ans, ...wrong]).map(x => ({ label:esc(x), value:x })) };
}
const canSpell = w => /^[a-z]+$/.test(w.w) && w.w.length <= 9;
function engTypes(w) {   // các dạng câu hỏi hợp với lớp của từ
  const mode = CONTENT[UNIT[w.unit].g].eng, t = mode === 'phonics' ? ['listen','picture','sentence'] : ['listenw','meaning','viEn','sentence'];
  if (mode !== 'phonics' && w.pic) t.push('picture');
  if (canSpell(w)) t.push('spell');
  return t;
}
function buildEngLesson(uid) {
  const u = UNIT[uid];
  if (CONTENT[u.g].eng !== 'phonics') {   // lớp 5, 6, 8: từ vựng + mẫu câu / ngữ pháp
    const ws = shuffle(u.words.filter(w => !w.ext)).concat(shuffle(u.words.filter(w => w.ext)));
    const pics = ws.filter(w => w.pic), sp = ws.filter(canSpell);
    const gi = shuffle(u.gq.map((_, i) => i));
    const qs = [engQ('listenw', ws[0].id), engQ(pics.length ? 'picture' : 'viEn', (pics[0] || ws[1]).id), engQ('meaning', ws[2 % ws.length].id), engQ('sentence', ws[3 % ws.length].id),
      gramQ(uid, gi[0]), gramQ(uid, gi[1 % gi.length]), engQ(sp.length ? 'spell' : 'viEn', (sp[0] || ws[4 % ws.length]).id), gramQ(uid, gi[2 % gi.length])];
    return qs;
  }
  const core = u.words.filter(w => !w.ext).map(w => w.id), all = u.words.map(w => w.id);
  const used = {};
  const take = pool => { const s = shuffle(pool).sort((a, b) => (used[a] || 0) - (used[b] || 0)); used[s[0]] = (used[s[0]] || 0) + 1; return s[0]; };
  const plan = ['listen','picture','phonics','sentence','listen','spell','picture','sentence'];
  return plan.map((t, i) => {
    let pool = i < 4 ? core : all;
    if (t === 'phonics') pool = core.filter(id => W[id].w.includes(u.ph));
    if (t === 'spell') { const short = pool.filter(id => W[id].w.length <= 8); pool = short.length ? short : pool; }
    return engQ(t, take(pool));
  });
}

function fsEnc(v) {

  if ('booleanValue' in x) return x.booleanValue; if ('arrayValue' in x) return (x.arrayValue.values || []).map(fsDec);

  quiz() {

    const lock = Q.locked ? 'disabled' : '';
    if (q.input === 'num') {
      ans = `<div class="ansbox"><span class="ansval ${Q.input ? '' : 'empty'}">${Q.input || '?'}</span>${q.unit ? `<span class="unit">${esc(q.unit)}</span>` : ''}</div>
        <div class="numpad">${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-act="key" data-arg="${n}" ${lock}>${n}</button>`).join('')}
        <button class="key del" data-act="key" data-arg="del" aria-label="Xóa" ${lock}>⌫</button><button class="key" data-act="key" data-arg="0" ${lock}>0</button><button class="key ok" data-act="key" data-arg="ok" ${lock}>Xong ✓</button>
        ${(q.keys || []).map(k => `<button class="key" data-act="key" data-arg="${k}" ${lock} aria-label="${k === '-' ? 'Dấu trừ' : 'Dấu phẩy'}">${k === '-' ? '−' : ','}</button>`).join('')}</div>`;
    } else if (q.input === 'choice') {

        return `<button class="choice ${q.ccls || ''} ${cls}" data-act="choice" data-arg="${i}" ${lock} ${c.aria ? `aria-label="${esc(c.aria)}"` : ''}>${c.label}</button>`; }).join('')}</div>`;

      const built = Q.sel.map(i => q.letters[i]);

        <div class="tiles">${q.letters.map((l, i) => `<button class="tile" data-act="tile" data-arg="${i}" ${Q.sel.includes(i) || Q.locked ? 'disabled' : ''}>${l}</button>`).join('')}

      <div class="qmeta"><span class="tnum">Câu ${Q.i + 1}/${Q.total}</span><span>${Q.kind === 'promo' ? (q.wid || q.eng ? '🎓 Phần Tiếng Anh' : '🎓 Phần Toán') : Q.mode === 'test' ? 'Nhiệm vụ lớn' : Q.kind === 'math' ? `Cấp ${mathState(P(), Q.ref).level}` : 'Bài học'}</span></div>${Q.game ? '</div>' : ''}
      <div class="qcard ${q.wid || q.eng ? 'eng' : 'math'}">${q.wid || q.eng || mathTalk() ? '<button class="speak" data-act="qSay" aria-label="Nghe đề">🔊</button>' : ''}<div class="qtext">${q.text}</div></div>
      <div class="answer">${ans}</div>${fb}`;
  },
  cards() {

        ${FC.source === 'warmup' ? `<button class="btn primary big" data-act="startLesson">Vào bài học Unit ${UNIT[FC.unit].no} 🚀</button>` : `<button class="btn primary big" data-act="go" data-arg="stars">Về chòm sao</button>`}</section>`;

  result() {
    const r = RESULT, ratio = r.score / r.total;
    const msg = ratio >= 0.9 ? 'Xuất sắc!' : ratio >= 0.7 ? 'Giỏi lắm!' : ratio >= 0.5 ? 'Khá lắm!' : 'Cố lên nhé!';
    const nb = r.badges.map(id => { const b = BADGES.find(x => x.id === id); return `<div class="badge-new"><span class="emo">${b.e}</span><span><b>Huy hiệu mới: ${b.name}</b><br><small class="lead">${b.desc}</small></span></div>`; }).join('');
    const weak = r.weak.length ? `<p class="lead">Từ cần ôn thêm (sẽ quay lại ở lần khởi động sau):</p><div class="wordlist">${r.weak.map(id => `<button class="wchip" data-act="sayW" data-arg="${id}"><span class="emo">${W[id].e}</span>${esc(W[id].w)}</button>`).join('')}</div>` : '';
    const tl = timeLeft() <= 0 ? '<p class="banner">Hôm nay con đã học đủ giờ rồi. Nghỉ ngơi và hẹn gặp lại ngày mai nhé!</p>' : '';
    const pt = pet(P());
    let giftHTML = '';
    if (r.boxId) giftHTML = pt.pending.some(b => b.id === r.boxId)
      ? `<button class="giftbox" data-act="openBox" data-arg="${r.boxId}"><span class="emo">🎁</span><b>Con nhận được hộp quà! Chạm để mở</b></button>`
      : REVEAL && REVEAL.id === r.boxId ? revealHTML(REVEAL, false) : '<p class="lead">Hộp quà của bài này đã được mở.</p>';
    else giftHTML = `<p class="panel lead">Hôm nay con đã nhận đủ ${DB.settings.boxCap} hộp quà. Ngày mai lại có quà nhé! Sao vẫn được cộng.</p>`;
    const sp = (r.species || []).map(id => `<div class="badge-new"><span class="emo">🦖</span><span><b>Mở khóa khủng long mới: ${SPECIES[id].name}</b><br><small class="lead">Vào Bộ sưu tập để chọn bạn ấy</small></span></div>`).join('');
    const isPromo = r.kind === 'promo';
    const promoHTML = !isPromo ? '' : r.promoted
      ? `<div class="promo" style="cursor:default"><span class="emo">🎓</span><span><b>Chúc mừng con đã lên lớp ${r.promoted}!</b><small>Con được thưởng ${PROMO_GEMS} 💎 cho khủng long. Hành tinh lớp ${r.promoted} đang chờ con.</small></span></div>`
      : `<p class="panel lead">Lần này con đúng ${r.score}/${r.total} câu, cần ${r.need} câu để lên lớp. Không sao cả! Con ôn thêm những bài còn chưa chắc rồi thi lại nhé.</p>`;
    return `<section class="done"><div class="stars-row">${isPromo && r.promoted ? '🎓' : '⭐'.repeat(Math.max(1, Math.round(ratio * 3)))}</div><h2>${isPromo && r.promoted ? 'Lên lớp rồi!' : msg}</h2>
      <p class="score"><b class="tnum">${r.score}</b>/${r.total} câu đúng ngay lần đầu</p><p class="chip">+${r.stars} sao</p>
      ${promoHTML}${giftHTML}
      ${r.levelNote ? `<p class="lead">${r.levelNote}</p>` : ''}${nb}${sp}${weak}${tl}
      <div class="row">${isPromo && r.promoted ? `<button class="btn primary big" data-act="go" data-arg="home">Về trạm lớp ${r.promoted} 🚀</button>` : `<button class="btn primary big" data-act="again">${isPromo ? 'Thi lại 🎓' : 'Bay lại 🚀'}</button>`}<button class="btn" data-act="go" data-arg="dino">🦕 Nhà khủng long</button>${isPromo ? '' : `<button class="btn ghost" data-act="go" data-arg="${r.kind === 'math' ? 'math' : 'eng'}">Về hành tinh</button>`}</div></section>`;
  },
  stars() {
    const p = P(); const counts = [0,0,0,0,0,0];

  race() {
    const p = P(), wk = weekStart(today());

        <div class="kpi"><b>${GW.filter(w => p.words[w.id]).length}/${GW.length}</b><small>từ lớp ${VG(p)} đã gặp</small></div><div class="kpi"><b>${p.stars}</b><small>sao đã nhận</small></div></div></div>

      <div class="pcard"><h3>Số phút học mỗi ngày</h3><div class="chart">${days.map((d, i) => `<div class="col ${d === t ? 'today' : ''}"><span>${mins[i]}</span><i style="height:${Math.round(mins[i] / mx * 100)}%"></i><small>${dow(d)}</small></div>`).join('')}</div></div>

/* ---------- render ---------- */
function render() {
  if (!P() && !['welcome','profiles','restore','teach','tkid'].includes(route.name)) route = { name: DB.profiles.length ? 'profiles' : 'welcome' };
  if (route.name === 'parent' && !parentOpen) route = { name:'home' };
  if (['math','eng'].includes(route.name) && !hasContent(P()) && !READY_GRADES.includes(gradeOf(P()) - 1)) route = { name:'home' };
  renderTop();
  $('#view').innerHTML = VIEWS[route.name]();
}

/* ---------- quiz engine ---------- */
function startQuiz(o) {
  Q = Object.assign({ i:0, score:0, stars:0, marks:[], wrongWords:[], levelNote:'', items:null }, o);
  Q.total = Q.items ? Q.items.length : Q.total;
  if (Q.kind === 'math' && Q.mode === 'lesson') Q.levelStart = mathState(P(), Q.ref).level;
  loadQ(); go('quiz'); speakQ();
}
function loadQ() {
  if (Q.items) Q.q = Q.items[Q.i];
  else { const lv = mathState(P(), Q.ref).level; let q, g = 0; do { q = GEN[Q.ref](lv); } while (Q.q && q.text === Q.q.text && g++ < 6); Q.q = q; }
  Q.tries = 0; Q.input = ''; Q.sel = []; Q.locked = false; Q.fb = null; Q.picked = null;
}
const mathTalk = () => !!(Q && Q.q && !Q.q.wid && !Q.q.eng && DB.settings.readMath1 !== false && CONTENT[VG()] && CONTENT[VG()].mathRead);   // lớp 1: đọc đề Toán
const talk = () => DB.settings.autoRead && Q && Q.q && (!!Q.q.wid || !!Q.q.eng || mathTalk());   // đọc câu Tiếng Anh; Toán chỉ đọc ở lớp 1
function speakQ() { if (talk()) say(toParts(Q.q.say || Q.q.text)); }
function startMath(tid) { if (!canStudy()) return; startQuiz({ kind:'math', ref:tid, mode:'lesson', total:10, title:TOPIC[tid].name }); }
function startTest(id) {
  const T = TESTS[id]; if (!T || !canStudy()) return;
  let items;
  if (T.kind === 'math') items = shuffle(Array.from({ length:10 }, (_, i) => { const t = T.topics[i % T.topics.length]; return Object.assign(GEN[t](2), { topic:t }); }));
  else items = shuffle(ALLW.filter(w => T.units.includes(w.unit))).slice(0, 10).map(w => engQ(pick(engTypes(w)), w.id));
  startQuiz({ kind:T.kind, ref:id, mode:'test', items, title:T.name });
}
/* ---------- bài thi lên lớp ---------- */
const PROMO_N = 30, PROMO_MATH = 20, PROMO_GEMS = 50;
function startPromo() {
  const p = P(); if (!p.promo || !hasContent(p) || !canStudy()) return;
  const tps = C(p).math.filter(t => !t.adv), order = shuffle(tps);   // Toán cả năm, cấp 2, không gợi ý
  const math = Array.from({ length:PROMO_MATH }, (_, i) => { const t = order[i % order.length].id; return Object.assign(GEN[t](2), { topic:t }); });
  const eng = shuffle(gradeWords(gradeOf(p)).filter(w => !w.ext)).slice(0, PROMO_N - PROMO_MATH).map(w => engQ(pick(engTypes(w)), w.id));
  startQuiz({ kind:'promo', ref:'lop' + p.promo.to, mode:'test', items:[...math, ...eng], title:`Bài thi lên lớp ${p.promo.to}` });
}
function promote(p, how, score) {
  const from = gradeOf(p), to = Math.min(GRADE_MAX, from + 1);
  p.grade = to; p.promo = null; p.assign = null;
  (p.gradeLog = p.gradeLog || []).push({ d:today(), from, to, how, score: score || '' });
  if (how !== 'sua') pet(p).gems += PROMO_GEMS;
  return to;
}
const semTabs = (k, hk) => `<div class="tabs" role="tablist">${[1, 2].map(n => `<button class="tab ${hk === n ? 'on' : ''}" data-act="sem" data-arg="${k}${n}" role="tab" aria-selected="${hk === n}">Học kỳ ${n}</button>`).join('')}</div>`;
function testRows(p, kind, hk) {
  return Object.entries(TESTS).filter(([, T]) => T.kind === kind && T.hk === hk && T.g === VG()).map(([id, T]) => {
    const best = p.log.filter(l => l.ref === id).reduce((m, l) => Math.max(m, l.score), -1);
    const sub = T.kind === 'math' ? T.topics.slice(0, 4).map(t => TOPIC[t].name).join(', ') + (T.topics.length > 4 ? ', …' : '') : 'Trộn từ vựng, mẫu câu và từ mở rộng';
    return `<button class="station" data-act="test" data-arg="${id}"><span class="orb" style="--c:var(--sun)">🏆</span><span class="st-body"><span class="st-name">${T.name}</span><span class="st-sub">${sub}</span><span class="st-sub">10 câu, không có gợi ý${best >= 0 ? ` · tốt nhất ${best}/10` : ''}</span></span></button>`;
  }).join('');
}
function adapt(ok) {
  if (Q.kind !== 'math' || Q.mode !== 'lesson') return;
  const s = mathState(P(), Q.ref);
  if (ok) { s.up++; s.down = 0; if (s.up >= 3 && s.level < 3) { s.level++; s.up = 0; toast(`Lên Cấp ${s.level}! Câu hỏi sẽ khó hơn một chút 🚀`); } }
  else { s.down++; s.up = 0; if (s.down >= 2 && s.level > 1) { s.level--; s.down = 0; toast(`Mình luyện lại Cấp ${s.level} cho thật chắc nhé`); } }
}
function submit(val) {
  if (Q.locked) return;
  const q = Q.q, p = P(), num = x => parseFloat(String(x).replace(',', '.'));
  const ok = String(val) === String(q.answer) || (q.input === 'num' && /^-?\d+(,\d*)?$/.test(String(val)) && num(val) === num(q.answer));   // 84,0 = 84
  const topic = q.wid || q.eng ? null : (q.topic || (Q.kind === 'math' ? Q.ref : null));
  if (ok) {
    Q.locked = true;
    if (Q.tries === 0) {
      Q.score++; Q.marks[Q.i] = true;
      if (Q.game) { Q.game.hits++; Q.game.hit(); } else { Q.stars++; addStars(p, 1); adapt(true); }   // thách đấu: không cộng sao
      if (topic) { const s = mathState(p, topic); s.att++; s.ok++; }
      if (q.wid) rateWord(q.wid, true);
    }
    Q.fb = { type:'good', html: Q.game ? 'Đúng rồi! 🔥' : Q.tries === 0 ? 'Đúng rồi! +1 ⭐' : 'Đúng rồi! Lần sau con làm đúng ngay nhé.' };
    tone(GOOD); render();
    if (q.wid || q.eng) burst($('.choice.right') || $('.slots'));
    if (q.okSay && talk()) say(q.okSay);
    save();
    nextT = setTimeout(nextQ, Q.game ? 650 : q.wid || q.eng ? 1700 : 1200);
    return;
  }
  Q.tries++; Q.picked = q.input === 'choice' ? val : null;
  if (Q.tries === 1) {
    Q.marks[Q.i] = false;
    if (topic) mathState(p, topic).att++;
    if (q.wid) { rateWord(q.wid, false); if (!Q.wrongWords.includes(q.wid)) Q.wrongWords.push(q.wid); }
    if (Q.game) { Q.game.streak = 0; Q.game.miss(); } else adapt(false);
  }
  tone(BAD);
  const hint = q.hint ? `<span class="hint">💡 ${esc(q.hint)}</span>` : '';
  if (Q.mode === 'test' || Q.tries >= 2) {
    Q.locked = true;
    const rv = q.reveal || `Đáp án là <b>${esc(q.answer)}</b>${q.unit ? ' ' + esc(q.unit) : ''}`;
    Q.fb = { type:'bad', html: Q.game ? `<span>${val === '__het_gio__' ? '⏰ Hết giờ! ' : ''}${rv}</span>` : `<span>${rv}</span>${hint}<button class="btn primary" data-act="qNext">Câu tiếp theo →</button>` };
    render(); if (Q.game) nextT = setTimeout(nextQ, 1500);
    if (talk()) say(q.revealSay || toParts(`Đáp án là ${q.answer}. ${q.hint || ''}`));
  } else {
    Q.input = ''; Q.sel = [];
    const tip = topic ? TIP[topic] : '';
    Q.fb = { type:'bad', html:`<span>Chưa đúng rồi, con thử lại nhé!</span>${tip ? `<span class="hint">💡 ${esc(tip)}</span>` : ''}` };
    render();
    if (talk()) say(q.replay ?[['Thử lại nhé','vi'], ...q.replay] : toParts('Thử lại nhé. ' + tip));
  }
  save();
}
function nextQ() {
  clearTimeout(nextT);
  if (Q.game) { if (Q.game.done || (Q.game.n && Q.i + 1 >= Q.game.n)) return finish(); Q.items.push(gameQ()); Q.total = Math.max(Q.total, Q.items.length); Q.qStart = Date.now(); }
  Q.i++;
  if (Q.i >= Q.total) return finish();
  loadQ(); render(); speakQ();
}
function streak(p) { const s = new Set(p.days); let n = 0, d = today(); if (!s.has(d)) d--; while (s.has(d)) { n++; d--; } return n; }
function finish() {
  if (Q && Q.game) { if (!Q.game.ended) { Q.game.ended = true; Q.game.end(); } return; }
  const p = P(), t = today();
  const bonus = Q.score === Q.total ? 3 : 0; if (bonus) addStars(p, bonus); Q.stars += bonus;
  p.log.push({ d:t, kind:Q.kind, ref:Q.ref, mode:Q.mode, score:Q.score, total:Q.total });
  if (p.log.length > 400) p.log = p.log.slice(-400);
  if (!p.days.includes(t)) p.days.push(t);
  let levelNote = '';
  if (Q.kind === 'math' && Q.mode === 'lesson') {
    const s = mathState(p, Q.ref); s.sessions++; s.best = Math.max(s.best, Q.score);
    if (s.level > Q.levelStart) levelNote = `Con đã lên Cấp ${s.level} ở chủ đề này!`;
    else if (s.level < Q.levelStart) levelNote = `Lần sau mình luyện Cấp ${s.level} cho chắc nhé.`;
  }
  const got = [];
  const add = id => { if (!p.badges.includes(id)) { p.badges.push(id); got.push(id); } };
  add('first');
  if (Q.score === Q.total) add('perfect');
  if (TOPIC[Q.ref] && TOPIC[Q.ref].adv && Q.mode === 'lesson' && Q.score >= 8) add('thinker');
  if (Q.mode === 'test') add('test');
  let promoted = 0, need = 0;
  if (Q.kind === 'promo' && p.promo) {
    need = Math.ceil(Q.total * DB.settings.passPct / 100);
    p.promo.tries = (p.promo.tries || 0) + 1; p.promo.best = Math.max(p.promo.best || 0, Q.score);
    if (Q.score >= need) { promoted = promote(p, 'thi', `${Q.score}/${Q.total}`); add('grad'); }
  }
  if (streak(p) >= 3) add('streak3');
  if (Object.values(p.words).filter(s => s.tier >= 3).length >= 10) add('words10');

const twLabel = tw => `${tw.dow === 0 ? 'Chủ nhật' : 'Thứ ' + ['','Hai','Ba','Tư','Năm','Sáu','Bảy'][tw.dow]} ${String(tw.h).padStart(2, '0')}:${String(tw.m).padStart(2, '0')}–${(() => { const e = tw.h * 60 + tw.m + tw.mins; return String(Math.floor(e / 60)).padStart(2, '0') + ':' + String(e % 60).padStart(2, '0'); })()}`;

const teamOver = () => { const tw = bossTW(), d = new Date(), m = d.getHours() * 60 + d.getMinutes(), dd = x => x === 0 ? 7 : x;   // đã qua giờ đánh chung của tuần này

  duel() {
    const p = P(), gd = gData(), t = today(), n = gd.duel.d === t ? gd.duel.n : 0;
    const inv = ARENA.duIn.filter(d => d.st === 'wait' && t - d.d <= 1);
    const friends = RACE.list.filter(m => m.id !== p.id && m.nick);
    return `<p class="lead">Con chơi 10 câu trước, bạn chơi sau rồi so điểm. Điểm = câu đúng + nhanh tay. Mỗi ngày tối đa ${DUEL_DAY} trận (con đã đấu ${n}).</p>
      ${inv.length ? `<div class="team"><b>🔔 Lời mời đấu</b>${inv.map(d => `<div class="row" style="justify-content:space-between"><span>${esc(d.fn)} (lớp ${d.grade}) được <b>${d.s1}</b> điểm, thách con!</span><button class="btn primary" data-act="duelAccept" data-arg="${d.id}" ${n >= DUEL_DAY ? 'disabled' : ''}>Nhận đấu</button></div>`).join('')}</div>` : ''}
      <div class="pcard"><h3>Mời bạn đấu</h3><div class="checks">${friends.map(m => `<div class="check"><span class="emo" style="font-size:26px">${esc(m.av)}</span><span style="flex:1">${esc(m.nick)} · lớp ${m.grade}</span><button class="btn sm primary" data-act="duelInvite" data-arg="${m.id}" ${n >= DUEL_DAY ? 'disabled' : ''}>Mời đấu</button></div>`).join('') || '<p class="lead">Lớp chưa có bạn nào khác.</p>'}</div></div>
      ${ARENA.duOut.length ? `<div class="pcard"><h3>Trận con đã mời</h3><div class="checks">${ARENA.duOut.slice(-8).reverse().map(d => `<div class="check"><span style="flex:1">⚔️ ${esc(d.tn)}: ${d.st === 'done' ? `con ${d.s1} – ${d.s2} bạn · ${d.s1 > d.s2 ? 'con thắng 🎉' : d.s1 < d.s2 ? 'bạn thắng' : 'hòa'}` : `con ${d.s1} điểm, đang chờ bạn…`}</span></div>`).join('')}</div></div>` : ''}`;
  },
  gres() {
    const r = GRES; if (!r) return '';
    return `<section class="done"><div class="stars-row">${r.emo}</div><h2>${esc(r.title)}</h2><p class="score"><b class="tnum">${r.big}</b></p><p class="lead">${r.text}</p>${r.gems ? `<p class="chip">+${r.gems} 💎</p>` : ''}
      <div class="row"><button class="btn primary big" data-act="go" data-arg="${r.back}">Tiếp tục 🚀</button><button class="btn" data-act="go" data-arg="arena">🏆 Đấu trường</button></div></section>`;
  },
});
Object.assign(META, { arena:{ back:'home', title:'Thách đấu' }, raceboard:{ back:'arena', title:'Đua tàu lên Sao Hỏa' }, boss:{ back:'arena', title:'Quái vật Thiên thạch' }, duel:{ back:'arena', title:'Đấu 1 với 1' }, gres:{ back:'arena', title:'Kết quả' } });
const gEnd = (r) => { clearInterval(gTick); const p = P(); if (r.gems) pet(p).gems += r.gems; GRES = r; save(); cloudSync(p); go('gres'); tone([523, 659, 784, 1047]); };
Object.assign(ACT, {
  arenaReload: () => { ARENA.msg = ''; arenaLoad(); },
  raceGo: () => {
    const gd = gData(), wk = weekStart(today()); if (!raceOpen() || (gd.raceRuns[wk] || []).length >= RACE_RUNS) return;
    startGame({ title:'🚀 Đua tàu lên Sao Hỏa', secs:RACE_SECS,
      hud() { return `<div class="qmeta"><span class="tnum">⏱️ ${mmss(gLeft(this))}</span><span>🚀 ${this.score} km ${this.streak >= 3 ? '🔥 Tăng tốc!' : ''}</span></div>${gHudBar(this.score / 3, '🌍 → 🔴 Sao Hỏa')}`; },
      hit() { this.streak++; this.score += this.streak >= 3 ? 20 : 10; }, miss() { this.streak = 0; this.score = Math.max(0, this.score - 2); },
      end() { const p = P(), runs = (gd.raceRuns[wk] = gd.raceRuns[wk] || []); runs.push(this.score); const best = Math.max(...runs), gems = Math.min(10, Math.floor(this.score / 30));
        gPut(`race-${wk}-${p.id}`, 'race', 'race:' + wk, { best, runs }).then(arenaLoad).catch(() => {});
        gEnd({ emo:'🚀', title:'Hạ cánh!', big:`${this.score} km`, text:`Con trả lời đúng ${this.hits} câu. Lượt tốt nhất tuần này: ${best} km. Còn ${RACE_RUNS - runs.length} lượt.`, gems, back:'raceboard' }); } });
  },
  bossGo: a => {
    const p = P(), gd = gData(), wk = weekStart(today()), t = today(), team = a === 'team';
    if (gd.boss.d !== t) gd.boss = { d:t, secs:0 };
    const left = team ? 30 * 60 : BOSS_SECS - gd.boss.secs; if (left <= 0) return;
    const me = ARENA.kids.find(k => k.pid === p.id) || { s1:0, s2:0 }; let pending = 0;
    const flush = () => { me.s1 = me.s1 || 0; me.s2 = me.s2 || 0; return gPut(`bk-${wk}-${p.id}`, 'bossk', 'boss:' + wk, { s1:me.s1, s2:me.s2 }).catch(() => {}); };
    if (!ARENA.kids.includes(me)) { me.pid = p.id; me.fn = p.name; me.av = p.avatar; me.grade = gradeOf(p); ARENA.kids.push(me); }
    const poll = team ? setInterval(() => gList('q', 'boss:' + wk).then(ks => { ARENA.kids = ks.map(k => k.pid === p.id ? Object.assign(k, { s1:me.s1, s2:me.s2 }) : k); if (!ARENA.kids.some(k => k.pid === p.id)) ARENA.kids.push(me); }).catch(() => {}), 3000) : null;
    const [be] = bossOf(wk);
    startGame({ title: team ? '⚔️ Trận đồng đội' : '🔫 Đánh lẻ quái vật', secs:left,
      hud() { const h = bossHP(); return `<div class="qmeta"><span class="tnum">⏱️ ${mmss(gLeft(this))}</span><span>${be} 🔫 ${this.hits} phát</span></div>${gHudBar(h.left / h.hp * 100, `❤️ Máu quái ${h.left}/${h.hp}${team ? ` · ${ARENA.kids.filter(k => k.s2 > 0).length} bạn đang chiến đấu` : ''}`)}`; },
      hit() { if (team) me.s2++; else me.s1++; if (++pending >= 3) { pending = 0; flush(); } const h = bossHP(); if (h.left <= 0 || (!team && h.solo1Left <= 0)) this.done = true; },
      miss() {},
      end() { clearInterval(poll); flush().then(arenaLoad); if (!team) { gd.boss.secs += Math.round((Date.now() - this.t0) / 1000); }
        const h = bossHP(); gEnd({ emo: h.left <= 0 ? '💥' : be, title: h.left <= 0 ? 'Quái vật đã bị hạ!' : 'Bắn tốt lắm!', big:`${this.hits} phát bắn`, text: h.left <= 0 ? 'Cả đội thắng rồi! Vào Đấu trường để nhận thưởng.' : `Máu quái còn ${h.left}/${h.hp}.`, gems:Math.min(5, Math.ceil(this.hits / 5)), back:'boss' }); } });
  },
  duelInvite: a => { const gd = gData(), t = today(), m = RACE.list.find(x => x.id === a); if (!m) return; if (gd.duel.d !== t) gd.duel = { d:t, n:0 }; if (gd.duel.n >= DUEL_DAY) return; duelPlay({ to:m.id, tn:m.nick }); },
  duelAccept: a => { const gd = gData(), t = today(), d = ARENA.duIn.find(x => x.id === a); if (!d || d.st !== 'wait') return; if (gd.duel.d !== t) gd.duel = { d:t, n:0 }; if (gd.duel.n >= DUEL_DAY) return; duelPlay(null, d); },
});
function duelPlay(inv, d) {
  const p = P(), qs = gradeOf(p) <= 2 ? 20 : 15;
  startGame({ title: d ? `⚔️ Đấu với ${d.fn}` : `⚔️ Thách đấu ${inv.tn}`, n:DUEL_N, qsecs:qs,
    hud() { const r = Math.max(0, Math.ceil(qs - (Date.now() - Q.qStart) / 1000)); return `<div class="qmeta"><span class="tnum">Câu ${Q.i + 1}/${DUEL_N} · ⏱️ ${r}s</span><span>⚔️ ${this.score} điểm${d ? ` · bạn ${d.s1}` : ''}</span></div>${gHudBar(r / qs * 100, 'Trả lời nhanh được thêm điểm')}`; },
    hit() { this.score += 100 + Math.round(50 * Math.max(0, qs * 1000 - (Date.now() - Q.qStart)) / (qs * 1000)); },
    miss() {},
    end() {
      const gd = gData(); gd.duel.n++;
      if (d) {
        const res = Object.assign({}, d, { s2:this.score, c2:this.hits, st:'done' }); delete res.id;
        const host = { id:d.pid, name:d.fn, avatar:d.av, grade:d.grade };
        gPut(d.id, 'duel', d.q, { from:res.from, fn:res.fn, to:res.to, tn:res.tn, s1:res.s1, c1:res.c1, s2:res.s2, c2:res.c2, st:'done', d:res.d }, host, d.q2).then(arenaLoad).catch(() => {});
        const r = this.score > d.s1 ? 'thắng' : this.score < d.s1 ? 'thua' : 'hòa';
        gEnd({ emo: r === 'thắng' ? '🏆' : '⚔️', title:`Con ${r}!`, big:`${this.score} – ${d.s1}`, text:`Con đúng ${this.hits}/${DUEL_N} câu, ${d.fn} được ${d.s1} điểm.`, gems: r === 'thắng' ? 15 : r === 'hòa' ? 10 : 5, back:'duel' });
      } else {
        const id = 'duel-' + rid(10).toLowerCase();
        gPut(id, 'duel', 'duelto:' + inv.to, { from:p.id, fn:p.name, to:inv.to, tn:inv.tn, s1:this.score, c1:this.hits, s2:null, c2:null, st:'wait', d:today() }, null, 'duelfrom:' + p.id).then(arenaLoad).catch(() => toast('Chưa gửi được lời mời, kiểm tra mạng nhé.'));
        gEnd({ emo:'⚔️', title:'Đã gửi lời thách đấu!', big:`${this.score} điểm`, text:`Con đúng ${this.hits}/${DUEL_N} câu. Khi ${inv.tn} chơi xong, con sẽ thấy kết quả trong Đấu 1 với 1.`, gems:0, back:'duel' });
      }
    } });
}

/* time tracking: only while doing a lesson or flipping cards */
let tick = 0;
setInterval(() => {
  if (document.hidden || !['quiz','cards','village','visit'].includes(route.name)) return;
  const p = P(); if (!p) return;
  const t = today(); p.time[t] = (p.time[t] || 0) + 1000;
  if (++tick % 15 === 0) save();
}, 1000);
window.addEventListener('pagehide', save);

/* starfield */
(() => { let h = ''; for (let i = 0; i < 70; i++) { const s = (Math.random() * 2 + 1).toFixed(1); h += `<i style="left:${(Math.random() * 100).toFixed(2)}%;top:${(Math.random() * 100).toFixed(2)}%;width:${s}px;height:${s}px;animation-delay:${(Math.random() * 4).toFixed(2)}s"></i>`; } $('.sky').innerHTML = h; })();

if (!DB.current && DB.profiles[0]) DB.current = DB.profiles[0].id;
route = { name: P() ? 'home' : (DB.profiles.length ? 'profiles' : 'welcome') };
render();
if (cloudOn() && DB.cloud.group) { loadCheers(); if (P()) cloudSync(P()); }
if (cloudOn()) { joinFromLink(); kidPull(); }
window.addEventListener('hashchange', joinFromLink);
document.addEventListener('visibilitychange', () => { if (!document.hidden) kidPull(); });
</script>
